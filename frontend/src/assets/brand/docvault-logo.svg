    <circle cx="24.5" cy="24.5" r="3.2" fill="#6366F1" />
    <path d="M24.5 18V21M24.5 28V31M18 24.5H21M28 24.5H31" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <!-- Typography for Light Backgrounds -->
  <text x="54" y="34" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#0F172A" letter-spacing="-0.7px">Doc<tspan fill="url(#aiLogoGrad)">Vault</tspan></text>
  <!-- Small AI tag -->
  <rect x="175" y="16" width="32" height="18" rx="9" fill="#EEF2FF" />
  <text x="181" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#6366F1" letter-spacing="0.5px">AI</text>
