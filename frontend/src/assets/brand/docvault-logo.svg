<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="240" height="52" fill="none">
  <defs>
    <linearGradient id="aiLogoGrad" x1="4" y1="4" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Shield Symbol with AI Spark & Vault Node -->
  <g transform="translate(4, 3) scale(0.95)" filter="url(#glow)">
    <path d="M24 3L6 10V22C6 33.5 13.8 43.5 24 46C34.2 43.5 42 33.5 42 22V10L24 3Z" fill="url(#aiLogoGrad)" />
