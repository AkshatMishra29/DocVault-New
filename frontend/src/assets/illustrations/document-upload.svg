<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="540" height="420" fill="none">
  <defs>
    <linearGradient id="upGrad" x1="60" y1="50" x2="480" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="upShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect x="20" y="20" width="500" height="380" rx="24" fill="url(#upGrad)" stroke="#C7D2FE" stroke-width="1.5" />

  <!-- Dotted Dropzone Border -->
  <rect x="60" y="60" width="420" height="280" rx="20" fill="#FFFFFF" fill-opacity="0.8" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 8" filter="url(#upShadow)" />

  <!-- Cloud / Ingestion Arrow Graphic -->
  <g transform="translate(230, 95)">
    <circle cx="40" cy="40" r="36" fill="#EFF6FF" />
    <path d="M40 25V55M40 25L28 37M40 25L52 37" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Formats -->
  <text x="270" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Drop files to ingest into DocVault</text>
  <text x="270" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">PDF, PNG, JPG, WEBP • Max 25 MB</text>

  <!-- Pipeline Step Indicators -->
  <g transform="translate(100, 245)">
    <!-- Step 1: Conditioning -->
    <rect x="0" y="0" width="100" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="16" cy="21" r="6" fill="#3B82F6" />
    <text x="28" y="19" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1E293B">1. Conditioning</text>
    <text x="28" y="31" font-family="Inter, sans-serif" font-size="8.5" font-weight="500" fill="#64748B">Sharp filter</text>

    <!-- Arrow -->
    <path d="M106 21H116" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Step 2: OCR -->
    <rect x="122" y="0" width="95" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="138" cy="21" r="6" fill="#0D9488" />
    <text x="150" y="19" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1E293B">2. Hybrid OCR</text>
    <text x="150" y="31" font-family="Inter, sans-serif" font-size="8.5" font-weight="500" fill="#64748B">Tesseract/Qwen</text>

    <!-- Arrow -->
    <path d="M223 21H233" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Step 3: Entity AI -->
    <rect x="239" y="0" width="105" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="255" cy="21" r="6" fill="#7C3AED" />
    <text x="267" y="19" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1E293B">3. Groq Extraction</text>
    <text x="267" y="31" font-family="Inter, sans-serif" font-size="8.5" font-weight="500" fill="#64748B">Auto-keyDetails</text>
  </g>
</svg>
