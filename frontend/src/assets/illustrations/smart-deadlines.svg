<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="540" height="420" fill="none">
  <defs>
    <linearGradient id="calGrad" x1="80" y1="50" x2="460" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="calShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect x="20" y="20" width="500" height="380" rx="24" fill="#FFFBEB" fill-opacity="0.6" stroke="#FDE68A" stroke-width="1.5" />

  <!-- Calendar Base Card -->
  <g transform="translate(60, 60)" filter="url(#calShadow)">
    <rect x="0" y="0" width="420" height="300" rx="16" fill="url(#calGrad)" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Calendar Header -->
    <path d="M0 16C0 7.16344 7.16344 0 16 0H404C412.837 0 420 7.16344 420 16V60H0V16Z" fill="#1E293B" />
    <circle cx="30" cy="30" r="6" fill="#EF4444" />
    <circle cx="50" cy="30" r="6" fill="#F59E0B" />
    <circle cx="70" cy="30" r="6" fill="#10B981" />
    <text x="170" y="36" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">November 2026</text>

    <!-- Calendar Grid Simulation -->
    <g transform="translate(30, 80)">
      <!-- Columns -->
      <line x1="0" y1="35" x2="360" y2="35" stroke="#F1F5F9" stroke-width="1.5" />
      <line x1="0" y1="80" x2="360" y2="80" stroke="#F1F5F9" stroke-width="1.5" />
      <line x1="0" y1="125" x2="360" y2="125" stroke="#F1F5F9" stroke-width="1.5" />
      <line x1="0" y1="170" x2="360" y2="170" stroke="#F1F5F9" stroke-width="1.5" />

      <!-- Urgent Renewal Badge Card (Floating Event) -->
      <g transform="translate(60, 45)">
        <rect x="0" y="0" width="220" height="42" rx="8" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1" />
        <circle cx="16" cy="21" r="5" fill="#DC2626" />
        <text x="30" y="19" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#991B1B">Health Insurance Renewal</text>
        <text x="30" y="32" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#DC2626">Expires in 6 days • Action Required</text>
      </g>

      <!-- Upcoming Warranty Card -->
      <g transform="translate(140, 110)">
        <rect x="0" y="0" width="200" height="42" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1" />
        <circle cx="16" cy="21" r="5" fill="#D97706" />
        <text x="30" y="19" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#92400E">MacBook Pro Warranty</text>
        <text x="30" y="32" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#B45309">AppleCare expiry in 28 days</text>
      </g>
    </g>
  </g>

  <!-- iCalendar RFC-5545 Sync Pill -->
  <g transform="translate(160, 360)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#059669" />
    <circle cx="18" cy="17" r="4" fill="#A7F3D0" />
    <text x="32" y="22" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">1-Click Sync to Apple / Google</text>
  </g>
</svg>
