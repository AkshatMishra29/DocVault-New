<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="540" height="420" fill="none">
  <defs>
    <linearGradient id="vaultBaseGrad" x1="50" y1="50" x2="490" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="vaultCardGrad" x1="140" y1="120" x2="380" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="vaultShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.12" />
    </filter>
  </defs>
  <!-- Background Glow & Grid Platform -->
  <rect x="20" y="20" width="500" height="380" rx="24" fill="url(#vaultBaseGrad)" stroke="#BFDBFE" stroke-width="1.5" />
  <circle cx="270" cy="210" r="140" fill="#3B82F6" fill-opacity="0.08" />
  <circle cx="270" cy="210" r="190" stroke="#93C5FD" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.6" />

  <!-- Cascading Back Document Cards -->
  <rect x="130" y="80" width="220" height="150" rx="14" fill="#FFFFFF" fill-opacity="0.75" stroke="#CBD5E1" stroke-width="1" transform="rotate(-7 130 80)" />
  <rect x="210" y="80" width="220" height="150" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1" transform="rotate(7 210 80)" />

  <!-- Main Vault Protected Core Card -->
  <g filter="url(#vaultShadow)">
    <rect x="135" y="110" width="270" height="230" rx="18" fill="url(#vaultCardGrad)" stroke="#93C5FD" stroke-width="1.5" />
    
    <!-- Header of Mock Protected Card -->
    <rect x="160" y="135" width="120" height="14" rx="4" fill="#1E293B" />
    <rect x="160" y="157" width="80" height="8" rx="3" fill="#94A3B8" />
    <rect x="335" y="132" width="45" height="18" rx="9" fill="#DCFCE7" />
    <circle cx="345" cy="141" r="3" fill="#16A34A" />

    <!-- Protected Metadata Lines -->
    <line x1="160" y1="185" x2="380" y2="185" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="160" y="200" width="100" height="10" rx="3" fill="#CBD5E1" />
    <rect x="310" y="200" width="70" height="10" rx="3" fill="#93C5FD" />
    <rect x="160" y="222" width="130" height="10" rx="3" fill="#CBD5E1" />
    <rect x="330" y="222" width="50" height="10" rx="3" fill="#93C5FD" />
  </g>

  <!-- High-Security Emblazoned Shield Badge in Foreground -->
  <g transform="translate(230, 240) scale(1.6)" filter="url(#vaultShadow)">
    <path d="M24 4L8 10V22C8 32.5 14.8 42.2 24 44C33.2 42.2 40 32.5 40 22V10L24 4Z" fill="#2563EB" />
    <!-- Golden Dial / Inner Ring -->
    <circle cx="24" cy="22" r="9" fill="#1D4ED8" stroke="#93C5FD" stroke-width="1.5" />
    <circle cx="24" cy="22" r="4" fill="#FFFFFF" />
    <path d="M23 23H25L25.5 28H22.5L23 23Z" fill="#FFFFFF" />
  </g>

  <!-- Status Chip: Bounded & Encrypted -->
  <g transform="translate(180, 360)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#1E40AF" />
    <circle cx="16" cy="16" r="4" fill="#34D399" />
    <text x="30" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Two-Factor Protected Vault</text>
  </g>
</svg>

