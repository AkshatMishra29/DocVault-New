<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="540" height="420" fill="none">
  <defs>
    <linearGradient id="aiCardGrad" x1="100" y1="60" x2="440" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="aiDropShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E3A8A" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Container Outline -->
  <rect x="20" y="20" width="500" height="380" rx="24" fill="#F0FDF4" fill-opacity="0.5" stroke="#BBF7D0" stroke-width="1.5" />
  
  <!-- Left Source Document Stack -->
  <g transform="translate(45, 90)">
    <rect x="0" y="0" width="160" height="210" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#aiDropShadow)" />
    <!-- Doc Header -->
    <rect x="16" y="18" width="80" height="10" rx="3" fill="#1E293B" />
    <rect x="16" y="34" width="50" height="6" rx="2" fill="#94A3B8" />
    <line x1="16" y1="55" x2="144" y2="55" stroke="#F1F5F9" stroke-width="2" />
    <!-- Highlighted Policy Clauses in Blue -->
    <rect x="16" y="70" width="128" height="8" rx="2" fill="#E2E8F0" />
    <rect x="16" y="86" width="128" height="22" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
    <rect x="22" y="93" width="90" height="8" rx="2" fill="#1D4ED8" />
    <rect x="16" y="118" width="110" height="8" rx="2" fill="#E2E8F0" />
    <rect x="16" y="134" width="128" height="8" rx="2" fill="#E2E8F0" />
    <rect x="16" y="150" width="70" height="8" rx="2" fill="#E2E8F0" />
  </g>

  <!-- Neural Connection Rays -->
  <path d="M205 195 C230 195, 235 150, 265 150" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="4 4" />
  <circle cx="235" cy="172" r="5" fill="#3B82F6" />

  <!-- Right AI Chat Bubble Panel -->
  <g transform="translate(265, 75)" filter="url(#aiDropShadow)">
    <rect x="0" y="0" width="230" height="250" rx="16" fill="url(#aiCardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- User Prompt Bubble -->
    <rect x="35" y="20" width="180" height="42" rx="12" fill="#2563EB" />
    <text x="48" y="38" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#FFFFFF">What is my zero-dep</text>
    <text x="48" y="52" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#FFFFFF">deductible on motor policy?</text>

    <!-- AI Response Bubble -->
    <g transform="translate(15, 75)">
      <rect x="0" y="0" width="200" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="20" cy="20" r="10" fill="#0D9488" />
      <path d="M16 20L19 23L25 17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="36" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0F172A">DocVault Copilot</text>

      <rect x="15" y="45" width="170" height="6" rx="2" fill="#64748B" />
      <rect x="15" y="57" width="150" height="6" rx="2" fill="#64748B" />
      <rect x="15" y="69" width="165" height="6" rx="2" fill="#64748B" />

      <!-- Verified Grounding Citation Badge -->
      <rect x="15" y="90" width="170" height="36" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <circle cx="27" cy="108" r="4" fill="#2563EB" />
      <text x="36" y="105" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#1E40AF">Grounding Citation</text>
      <text x="36" y="117" font-family="Inter, sans-serif" font-size="8.5" font-weight="500" fill="#3B82F6">Clause 4.2: Bajaj_Motor_2026.pdf</text>
    </g>
  </g>
</svg>
